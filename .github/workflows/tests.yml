name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install hash-verified test dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r test-requirements.txt
      - name: Run synthetic regression tests
        run: python -m unittest discover -s tests -v
      - name: Test installer without downloads or launching models
        shell: pwsh
        run: ./tests/test_installer.ps1
      - name: Test Noctis setup and private-default delivery without network
        shell: pwsh
        run: ./tests/test_setup.ps1
      - name: Test targeted permission helper without elevation or ACL writes
        shell: pwsh
        run: ./tests/test_permissions.ps1
